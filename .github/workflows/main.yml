name: Automated Website 

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build Docker Image
        run: |
          echo "Building the web application Docker image..."
          docker build -t my-website:latest .

      # Save the image as a tar file so other jobs can use it
      - name: Save Docker image as artifact artifact
        run: docker save my-website:latest > image.tar

      - name: Upload Build Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: website-docker-image
          path: image.tar

      - name: Notify if build fails
        if: failure()
        run: echo "🚨🚨 Build job failed! Please check logs"


  Testing:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: website-docker-image

      # Load the saved image file back into the runner's local Docker daemon
      - name: Load Docker Image
        run: docker load < image.tar

      - name: Test Container Run
        run: |
          echo "Starting the container..."
          docker run -d -p 8080:80 --name test-app my-website:latest
          sleep 3

      - name: Verify Web Server Response
        run: |
          echo "Testing container web server response..."
          curl -I http://localhost:8080

      - name: Tear Down Container
        if: always()
        run: docker rm -f test-app

  Security_Scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: 0
          vuln-type: "os,library"
          output: trivy-results.json

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-result
          path: trivy-results.json 

  